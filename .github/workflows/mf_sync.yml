name: Wealth Navigator MF Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single or watchlist"
        required: true
        default: "watchlist"
        type: choice
        options:
          - single
          - watchlist
      scheme_code:
        description: "Required when mode=single"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test workflow
        run: |
          echo "Wealth Navigator MF Sync workflow is working"
          echo "Mode: ${{ inputs.mode }}"
          echo "Scheme: ${{ inputs.scheme_code }}"
