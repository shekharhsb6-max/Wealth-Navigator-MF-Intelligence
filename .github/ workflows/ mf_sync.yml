name: Wealth Navigator MF Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single or watchlist"
        required: true
        default: "watchlist"
      scheme_code:
        description: "Required only when mode=single"
        required: false
  schedule:
    - cron: "30 12 * * 1-5"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Sync selected MF
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'single' }}
        env:
          GGOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_CREDENTIALS }}OOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
         
        run: python python/run_mf_sync.py --scheme "${{ inputs.scheme_code }}"

      - name: Sync MF watchlist
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watchlist') }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: python python/sync_watchlist.py
